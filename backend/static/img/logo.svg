<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="DocCipher Breaker">
  <title>DocCipher Breaker</title>

  <!--
    Red skull with one glowing green eye.

    The skull is drawn without the rounded background plate an earlier version
    used. The plate looked good large, but at 16px it took most of the icon and
    squeezed the skull down to an unreadable dot in the taskbar. Everything that
    gave the mark its depth - gradient bone, orange rim light, brow ridge, glow
    - is kept; only the frame is gone, so the silhouette itself is the icon.
  -->

  <defs>
    <linearGradient id="boneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff2d55"/>
      <stop offset="55%"  stop-color="#e00035"/>
      <stop offset="100%" stop-color="#8c0020"/>
    </linearGradient>

    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ccffdd" stop-opacity="1"/>
      <stop offset="28%"  stop-color="#00ff41" stop-opacity="0.95"/>
      <stop offset="65%"  stop-color="#00ff41" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff6600" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="hardGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Jaw gaps punched out of the skull silhouette. -->
    <mask id="skullMask">
      <rect width="512" height="512" fill="#000"/>
      <g fill="#fff">
        <path d="M256 30c-92 0-158 66-158 156 0 43 15 75 36 100 12 15 18 26 20 44l4 36
                 c2 18 15 28 33 28h130c18 0 31-10 33-28l4-36c2-18 8-29 20-44
                 21-25 36-57 36-100 0-90-66-156-158-156z"/>
      </g>
      <g stroke="#000" stroke-width="9">
        <path d="M256 372v50M212 374v46M300 374v46M172 378v38M340 378v38"/>
      </g>
    </mask>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Silhouette, with the tooth gaps masked out. -->
    <rect x="60" y="10" width="392" height="450" fill="url(#boneGrad)" mask="url(#skullMask)"/>

    <!-- Rim light sweeping the upper-left temple. -->
    <path d="M152 200c4-48 23-83 55-104 21-14 45-22 71-25"
          fill="none" stroke="url(#rimGrad)" stroke-width="16"
          stroke-linecap="round" opacity="0.85"/>

    <!-- Brow ridge: the strongest "this is a skull" cue at small sizes. -->
    <path d="M132 186c36-17 78-19 114-6M266 180c36-13 78-11 114 6"
          fill="none" stroke="#8c0020" stroke-width="10"
          stroke-linecap="round" opacity="0.8"/>

    <!-- Dead socket. -->
    <path d="M146 232c0-32 26-53 57-53s55 23 55 55c0 30-23 51-55 51s-57-23-57-53z"
          fill="#12000a"/>

    <!-- Nasal cavity. -->
    <path d="M256 296l-27 48c-3 6 1 13 8 13h38c7 0 11-7 8-13z" fill="#12000a"/>

    <!-- Cheek shadows. -->
    <path d="M140 300c12 20 27 32 47 38M372 300c-12 20-27 32-47 38"
          fill="none" stroke="#8c0020" stroke-width="7"
          stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- The live green eye. -->
  <g>
    <circle cx="312" cy="234" r="76" fill="url(#eyeGlow)" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M254 234c0-32 26-55 57-55s55 23 55 55c0 30-23 51-55 51s-57-21-57-51z"
          fill="#031008"/>
    <circle cx="312" cy="232" r="29" fill="#00ff41" filter="url(#hardGlow)">
      <animate attributeName="r" values="29;32;29" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="312" cy="232" r="11" fill="#031008"/>
    <circle cx="303" cy="222" r="6" fill="#ccffdd" opacity="0.95"/>
  </g>
</svg>
